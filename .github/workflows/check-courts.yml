name: Check Highbury Fields availability

on:
  schedule:
    - cron: "*/5 * * * *"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
          cache: maven

      - name: Check all Highbury Fields courts
        run: mvn --batch-mode --file checker/pom.xml package

      - name: Fetch Better availability
        run: java -jar checker/target/court-fix-checker-0.1.0-SNAPSHOT.jar
